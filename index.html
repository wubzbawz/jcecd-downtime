<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>JCECD Downtime Response Lookup</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JCECD Downtime">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:#fff;padding:14px 16px;border-bottom:4px solid #dc2626}
header h1{font-size:20px;margin:0 0 3px}
header p{font-size:12px;margin:0;color:#cbd5e1}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:800;font-size:14px;margin-bottom:7px}
input{width:100%;font-size:18px;padding:13px 12px;border:2px solid #64748b;border-radius:9px;text-transform:uppercase}
button{min-height:46px;border:0;background:#0f172a;color:#fff;border-radius:9px;padding:10px 14px;font-weight:800;font-size:15px}
.searchrow{display:flex;gap:8px}.searchrow input{flex:1}.searchrow button{min-width:92px}
#status{font-size:13px;font-weight:700;margin-top:10px}
.result{display:block;width:100%;text-align:left;background:#fff;color:#0f172a;border:1px solid #cbd5e1;border-radius:10px;padding:12px;margin:9px 0}
.addr{font-size:16px;font-weight:800}.line{margin-top:7px;font-size:14px}
.badge{display:inline-block;font-weight:800;border-radius:999px;padding:5px 8px;font-size:12px;background:#dcfce7;color:#166534}
.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
#selected{display:none}#selected.show{display:block}
.big{font-size:22px;font-weight:900;margin:8px 0}.detail{border-top:1px solid #e2e8f0;padding-top:10px;margin-top:10px}
.detailLabel{font-size:12px;font-weight:900;color:#475569}.detailValue{font-size:22px;font-weight:900;margin-top:3px}
.note{font-size:13px;color:#475569;line-height:1.4;margin-top:8px}
footer{text-align:center;color:#64748b;font-size:11px;padding:8px 10px 20px}
@media(max-width:520px){.searchrow{display:block}.searchrow button{width:100%;margin-top:8px}}
</style>
</head>
<body>
<header><h1>JCECD DOWNTIME RESPONSE LOOKUP</h1><p>Fire Response + JCSO Beat</p></header>
<main>
<div class="card">
<label for="q">ADDRESS SEARCH</label>
<div class="searchrow">
<input id="q" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="2132 PINEHURST DR">
<button id="searchBtn" type="button">SEARCH</button>
</div>
<div id="status">Loading address database...</div>
</div>

<div id="selected" class="card">
<div id="selBadge"></div>
<div id="selAddr" class="big"></div>
<div class="detail"><div class="detailLabel">FIRE RESPONSE</div><div id="selFire" class="detailValue"></div></div>
<div class="detail"><div class="detailLabel">JCSO BEAT</div><div id="selBeat" class="detailValue"></div></div>
<div id="selNote" class="note"></div>
<div style="margin-top:12px"><button id="clearBtn" type="button">NEW SEARCH</button></div>
</div>
<div id="results"></div>
</main>
<footer>JCECD emergency downtime resource</footer>

<script>
let DATA=[];
let READY=false;
const q=document.getElementById('q');
const results=document.getElementById('results');
const status=document.getElementById('status');
const selected=document.getElementById('selected');

function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function vals(s){return s?String(s).split('|').filter(Boolean):[];}

function classify(fire,beat){
  const f=vals(fire),b=vals(beat);
  if(f.length>1||b.length>1)return{c:'warn',lab:'VERIFY',note:'More than one saved response is associated with this address. Confirm the exact location before dispatch.'};
  if(!f.length||!b.length)return{c:'bad',lab:'VERIFY',note:'One or more response fields are not assigned. Use manual downtime verification before dispatch.'};
  return{c:'',lab:'RESPONSE FOUND',note:'Stored response for the matched address.'};
}

function showSelected(row){
  const [addr,fire,beat]=row,x=classify(fire,beat);
  selected.className='card show';
  document.getElementById('selBadge').innerHTML='<span class="badge '+x.c+'">'+x.lab+'</span>';
  document.getElementById('selAddr').textContent=addr;
  document.getElementById('selFire').textContent=vals(fire).join(' / ')||'MANUAL VERIFICATION REQUIRED';
  document.getElementById('selBeat').textContent=vals(beat).join(' / ')||'MANUAL VERIFICATION REQUIRED';
  document.getElementById('selNote').textContent=x.note;
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  if(!READY){status.textContent='Address database is still loading. Please wait.';return;}
  const raw=norm(q.value);
  selected.className='card';
  results.innerHTML='';
  if(raw.length<2){status.textContent='Enter at least 2 characters.';return;}

  const toks=raw.split(' ').filter(Boolean),found=[];
  for(let i=0;i<DATA.length&&found.length<40;i++){
    const a=DATA[i][0];
    let ok=true;
    for(const t of toks){if(!a.includes(t)){ok=false;break;}}
    if(ok)found.push(DATA[i]);
  }

  status.textContent=found.length
    ? found.length+(found.length===40?' or more':'')+' match'+(found.length===1?'':'es')+'. Tap the correct address.'
    : 'No matching saved address found. Use manual downtime verification.';

  for(const r of found.slice(0,25)){
    const x=classify(r[1],r[2]),b=document.createElement('button');
    b.type='button'; b.className='result';
    b.innerHTML='<div class="addr">'+esc(r[0])+'</div>'+
      '<div class="line"><span class="badge '+x.c+'">'+x.lab+'</span></div>'+
      '<div class="line"><b>FIRE:</b> '+esc(vals(r[1]).join(' / ')||'VERIFY')+
      ' &nbsp; <b>JCSO BEAT:</b> '+esc(vals(r[2]).join(' / ')||'VERIFY')+'</div>';
    b.addEventListener('click',()=>showSelected(r));
    results.appendChild(b);
  }
}

async function loadData(){
  try{
    const response=await fetch('data.tsv',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const text=await response.text();
    DATA=text.split('\n').filter(Boolean).map(line=>{
      const p=line.split('\t');
      return[p[0]||'',p[1]||'',p[2]||''];
    });
    READY=true;
    status.textContent='READY - '+DATA.length.toLocaleString()+' addresses loaded.';
  }catch(err){
    READY=false;
    status.textContent='DATABASE LOAD FAILED. Refresh while connected to the internet.';
    console.error(err);
  }
}

document.getElementById('searchBtn').addEventListener('click',render);
q.addEventListener('keydown',e=>{if(e.key==='Enter')render();});
let timer;
q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,250);});
document.getElementById('clearBtn').addEventListener('click',()=>{
  q.value='';selected.className='card';results.innerHTML='';
  status.textContent=READY?'READY - '+DATA.length.toLocaleString()+' addresses loaded.':'Loading address database...';
  q.focus();
});

loadData();
if('serviceWorker'in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.error));
}
</script>
</body>
</html>
